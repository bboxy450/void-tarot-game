<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Void Tarot Game</title>
<style>
  :root { --bg: #0b0d14; --panel: #151927; --line: #2a3048; --ink: #e8e6f0; --dim: #8f93ab; --gold: #d9b56a; --ok: #7fd1a8; --bad: #e08a8a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Georgia, "Times New Roman", serif; }
  header { display: flex; gap: 18px; align-items: baseline; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0; color: var(--gold); font-weight: normal; letter-spacing: 1px; }
  header span { color: var(--dim); }
  header .grow { flex: 1; }
  main { display: grid; grid-template-columns: 300px 1fr 240px; gap: 18px; padding: 18px 20px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .hero img { width: 100%; border-radius: 10px; display: block; }
  .hero h2 { margin: 12px 0 4px; font-weight: normal; color: var(--gold); }
  .hero p { margin: 0 0 8px; color: var(--dim); }
  .step { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .step.done { border-color: #2f5a48; }
  .step h3 { margin: 0 0 8px; font-size: 15px; font-weight: normal; display: flex; gap: 8px; align-items: center; }
  .step h3 b { color: var(--gold); font-weight: normal; }
  .step h3 i { margin-left: auto; font-style: normal; color: var(--ok); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .card { width: 96px; text-align: center; font-size: 12px; color: var(--dim); }
  .card img { width: 96px; height: 144px; object-fit: cover; border-radius: 6px; display: block; border: 1px solid var(--line); }
  .card.play { cursor: pointer; }
  .card.play:hover img { border-color: var(--gold); transform: translateY(-3px); }
  .card small { display: block; color: var(--ink); }
  .card.changed img { border-color: var(--gold); box-shadow: 0 0 10px var(--gold); }
  .slot { width: 96px; height: 144px; border: 1px dashed var(--line); border-radius: 6px; display: grid; place-items: center; color: var(--dim); font-size: 12px; }
  button { background: #222842; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--gold); }
  button.on { border-color: var(--gold); color: var(--gold); }
  button.big { padding: 10px 18px; color: var(--gold); border-color: var(--gold); }
  .fact { color: var(--dim); margin: 0 0 8px; }
  .fact b { color: var(--ink); font-weight: normal; }
  #msg { min-height: 44px; padding: 10px 14px; border-left: 3px solid var(--gold); background: var(--panel); margin-bottom: 12px; border-radius: 0 8px 8px 0; }
  aside h3 { font-weight: normal; color: var(--gold); margin: 0 0 8px; font-size: 15px; }
  aside ul { margin: 0 0 18px; padding-left: 18px; color: var(--dim); }
  aside li { margin-bottom: 4px; }
  .end { grid-column: 1 / -1; text-align: center; padding: 60px 0; }
</style>
<header id="head"></header>
<main id="main"></main>
<script src="src/cards.js"></script>
<script src="src/machines.js"></script>
<script src="src/game.js"></script>
<script src="src/ui.js"></script>
